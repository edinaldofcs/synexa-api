services:
  db:
    image: pgvector/pgvector:pg15
    container_name: synexa-db-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: synexapassword
      POSTGRES_DB: synexa_db
    ports:
      - "5435:5432"
    volumes:
      - synexa_db_data:/var/lib/postgresql/data
    networks:
      - synexa-network

  redis:
    image: redis:7-alpine
    container_name: synexa-redis-dev
    ports:
      - "6379:6379"
    networks:
      - synexa-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: synexa-api:dev
    container_name: synexa-api-dev
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    environment:
      - ENVIRONMENT=development
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:synexapassword@db:5432/synexa_db?schema=public
      - DIRECT_URL=postgresql://postgres:synexapassword@db:5432/synexa_db?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - synexa-network

networks:
  synexa-network:
    driver: bridge

volumes:
  synexa_db_data:
