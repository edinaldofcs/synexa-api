services:
  redis:
    image: redis:7-alpine
    container_name: synexa-redis
    volumes:
      - synexa_redis_data:/data
    restart: always
    networks:
      - synexa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    image: edinaldofcs48/synexa-api:latest
    container_name: synexa-api
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - synexa-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/health-test" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  synexa-network:
    driver: bridge

volumes:
  synexa_redis_data:
